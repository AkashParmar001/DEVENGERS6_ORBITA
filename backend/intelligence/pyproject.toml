[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbita-intelligence"
version = "0.1.0"
description = "ORBITA Intelligence Service - Orbital mechanics, trajectory planning, and risk assessment"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "numpy>=2.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
